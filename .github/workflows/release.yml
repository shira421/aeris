name: Build apps

# Every push builds and tests the web app, the Android APK and the iOS app.
# Pushes to main also publish: a rolling "latest-build" release (stable download links)
# and, once per version in package.json, an immutable v<version> release.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  browser:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Browser test (headless Chrome, mocked feeds, desktop and iPhone sizes)
        run: npm run test:browser
      - name: Live services check (real providers, tiles, routes and 3D terrain)
        continue-on-error: true
        run: npm run test:live

  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APK
        working-directory: android
        run: gradle :app:assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Aeris-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Aeris-Android.apk
          retention-days: 14

  ios:
    needs: web
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Boot an iPhone simulator early (warm by the time the app is built)
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r,l in sorted(d.items(),reverse=True) if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
      - name: Generate the Xcode project
        run: |
          rm -rf ios/web && cp -R dist ios/web
          rm -f ios/web/Aeris.html
          brew install xcodegen
          cd ios && xcodegen generate
          xcodebuild -version

      - name: Build unsigned iPhone app (for AltStore / SideStore / Sideloadly)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Aeris.xcodeproj -scheme Aeris -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Aeris.app Payload/
          zip -qry ../Aeris-iOS-unsigned.ipa Payload
          ls -la ../Aeris-iOS-unsigned.ipa

      - name: Simulator smoke test (app launches, web app loads, live data arrives natively)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Aeris.xcodeproj -scheme Aeris -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO build | tail -5
          DEVICE="$SIM_DEVICE"
          echo "Simulator $DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b | tail -2
          xcrun simctl install "$DEVICE" simbuild/Build/Products/Release-iphonesimulator/Aeris.app
          for i in $(seq 1 30); do xcrun simctl get_app_container "$DEVICE" com.shira421.aeris >/dev/null 2>&1 && break; sleep 1; done
          # Location for the blue dot: allow it and place the simulator in Singapore.
          xcrun simctl privacy "$DEVICE" grant location com.shira421.aeris || true
          xcrun simctl location "$DEVICE" set 1.3521,103.8198 || true
          # The Home Screen registers a new install in the background. A launch sent before that
          # finishes can be dropped: the app never comes to the front (seen on main, 8 Nov).
          # Give it a moment, and relaunch if the page has not loaded within 40 s.
          sleep 5
          START=$(date +%s)
          for attempt in 1 2 3; do
            xcrun simctl launch --console-pty --terminate-running-process "$DEVICE" com.shira421.aeris -AerisSelfTest > ../selftest.log 2>&1 &
            for i in $(seq 1 40); do grep -q 'AERIS_EVENT page loaded' ../selftest.log && break; sleep 1; done
            if grep -q 'AERIS_EVENT page loaded' ../selftest.log; then echo "App up on attempt $attempt"; break; fi
            echo "::warning::Launch attempt $attempt: the app did not come to the front within 40 s, launching again"
            cp ../selftest.log "../selftest-attempt-$attempt.log" || true
            xcrun simctl terminate "$DEVICE" com.shira421.aeris || true
            sleep 3
          done
          sleep 15
          xcrun simctl io "$DEVICE" screenshot ../ios-early.png || true
          sips -Z 500 ../ios-early.png --out ../ios-early-s.png >/dev/null && sips -s format jpeg -s formatOptions 45 ../ios-early-s.png --out ../ios-early.jpg >/dev/null && echo "QA_SHOT ios-15s $(base64 -i ../ios-early.jpg | tr -d '\n')" || true
          sleep 60
          xcrun simctl io "$DEVICE" screenshot ../ios-simulator.png || true
          echo "--- running processes"; xcrun simctl spawn "$DEVICE" launchctl list | grep -i aeris || echo "Aeris is not running"
          echo "--- crash reports"; find ~/Library/Logs/DiagnosticReports -newermt "@$START" -iname '*Aeris*' -print -exec head -c 6000 {} \; 2>/dev/null || true
          echo "--- system log"; xcrun simctl spawn "$DEVICE" log show --start "$(date -r $START '+%Y-%m-%d %H:%M:%S')" --style compact --predicate 'process == "Aeris" OR (process CONTAINS "WebContent" AND messageType >= 16) OR eventMessage CONTAINS[c] "aeris"' 2>/dev/null | grep -v '^Timestamp' | tail -120 || true
          xcrun simctl terminate "$DEVICE" com.shira421.aeris || true
          cat ../selftest.log
          sips -Z 700 ../ios-simulator.png --out ../ios-small.png >/dev/null && sips -s format jpeg -s formatOptions 50 ../ios-small.png --out ../ios-small.jpg >/dev/null && echo "QA_SHOT ios-simulator $(base64 -i ../ios-small.jpg | tr -d '\n')" || true
          grep -q 'AERIS_SELFTEST.*"loaded":true.*"map":true' ../selftest.log
          grep -q 'AERIS_SELFTEST.*"device":true' ../selftest.log
          grep -q 'AERIS_SELFTEST.*"me":true' ../selftest.log && echo "Location reached the page through the device bridge" || echo "::warning::The simulator location did not reach the page"

      - name: Signed iPhone app (only when Apple signing secrets are configured)
        if: env.IOS_CERTIFICATE_P12 != '' && env.IOS_PROVISIONING_PROFILE != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"; KPASS="$(uuidgen)"
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KPASS" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          TEAM=${IOS_TEAM_ID:-$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")}
          APPID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          BUNDLE="${APPID#*.}"; [ "$BUNDLE" = "*" ] && BUNDLE=com.shira421.aeris
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          METHOD=${IOS_EXPORT_METHOD:-development}
          IDENTITY="Apple Development"; [ "$METHOD" != "development" ] && IDENTITY="Apple Distribution"
          cd ios
          xcodebuild archive -project Aeris.xcodeproj -scheme Aeris -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Aeris.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$UUID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE" | tail -20
          printf '%s' "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"><plist version=\"1.0\"><dict><key>method</key><string>$METHOD</string><key>teamID</key><string>$TEAM</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$UUID</string></dict><key>compileBitcode</key><false/></dict></plist>" > "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Aeris.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP"/export/*.ipa ../Aeris-iOS-signed.ipa
          security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-app
          path: |
            Aeris-iOS-unsigned.ipa
            Aeris-iOS-signed.ipa
            ios-simulator.png
            selftest.log
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [web, browser, android, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Package downloads
        run: |
          mkdir -p out
          cp artifacts/Aeris-Android.apk artifacts/Aeris-iOS-unsigned.ipa out/
          [ -f artifacts/Aeris-iOS-signed.ipa ] && cp artifacts/Aeris-iOS-signed.ipa out/ || true
          (cd artifacts && zip -qr ../out/Aeris-WebApp.zip . -x '*.apk' '*.ipa' '*.png' '*.log')
          SIZE=$(stat -c %s out/Aeris-iOS-unsigned.ipa)
          node -e "
            const fs=require('fs');const v=process.env.VERSION;
            fs.writeFileSync('out/altstore-source.json',JSON.stringify({name:'Aeris',identifier:'com.shira421.aeris.source',subtitle:'Live flight tracker',iconURL:'https://shira421.github.io/aeris/icons/icon-512.png',website:'https://github.com/shira421/aeris',apps:[{name:'Aeris',bundleIdentifier:'com.shira421.aeris',developerName:'shira421',subtitle:'Live flight tracker',localizedDescription:'Find any flight in the air worldwide by flight number, airline, aircraft type or registration. Save flights, aircraft and airports, and get alerts when saved flights take off and land. Live data from community ADS-B networks on an OpenStreetMap world map, with a 3D view.',iconURL:'https://shira421.github.io/aeris/icons/icon-512.png',tintColor:'#d96f49',versions:[{version:v,buildVersion:process.env.GITHUB_RUN_NUMBER,date:new Date().toISOString(),localizedDescription:'Build '+process.env.GITHUB_SHA.slice(0,7),downloadURL:'https://github.com/shira421/aeris/releases/download/latest-build/Aeris-iOS-unsigned.ipa',size:Number(process.argv[1]),minOSVersion:'15.0'}],appPermissions:{entitlements:[],privacy:{NSLocationWhenInUseUsageDescription:'Shows your position on the map and starts the map near you.'}}}],news:[]},null,2));
          " "$SIZE"
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
      - name: Update the rolling latest-build release
        run: |
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-build out/* --target "$GITHUB_SHA" --prerelease \
            --title "Aeris latest build (${GITHUB_SHA::7})" --notes-file .github/release-notes.md
      - name: Create the v${{ env.VERSION }} release once
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already published; its files stay unchanged. latest-build has this commit."
          else
            gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --latest \
              --title "Aeris v$VERSION" --notes-file .github/release-notes.md
          fi
